name: Android CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: premex-ab/setup-android-cli@v1
        with:
          packages: 'platforms/android-37 build-tools/35.0.0 platform-tools'
      - name: Build debug APK and run unit tests
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
