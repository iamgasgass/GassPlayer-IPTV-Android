name: Android CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: premex-ab/setup-android-cli@v1
        with:
          packages: 'platforms/android-37 build-tools/37.0.0 platform-tools'
      - name: Build debug APK and run unit tests
        shell: bash
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
      - name: Rename APK
        if: success()
        run: cp "$(find . -type f -path '*/build/outputs/apk/debug/*.apk' | head -n 1)" "$GITHUB_WORKSPACE/app-debug.apk"
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app-debug.apk
          if-no-files-found: error
