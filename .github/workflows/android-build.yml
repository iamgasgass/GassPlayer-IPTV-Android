name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-37.0
            build-tools;37.0.0

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: false

      - name: Build optimized release APK
        shell: bash
        run: gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Align and sign installable APK
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1

          UNSIGNED_APK="$(find app/build/outputs/apk/release -type f -name '*-unsigned.apk' -print -quit)"
          test -n "$UNSIGNED_APK"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/37.0.0"
          ALIGNED_APK="$RUNNER_TEMP/GassPlayer-release-aligned.apk"
          FINAL_APK="$GITHUB_WORKSPACE/GassPlayer-Android-TV-release.apk"
          KEYSTORE="$RUNNER_TEMP/gassplayer-release.keystore"

          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"

          keytool -genkeypair \
            -keystore "$KEYSTORE" \
            -storepass android \
            -keypass android \
            -alias gassplayer \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname "CN=GassPlayer, OU=Android, O=GassPlayer, L=Napoli, ST=Campania, C=IT"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias gassplayer \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$FINAL_APK" \
            "$ALIGNED_APK"

          "$BUILD_TOOLS/zipalign" -c -v 4 "$FINAL_APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$FINAL_APK"

          rm -f "$UNSIGNED_APK" "$ALIGNED_APK" "$KEYSTORE"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 30

      - name: Upload installable APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: GassPlayer-Android-TV-release
          path: GassPlayer-Android-TV-release.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
