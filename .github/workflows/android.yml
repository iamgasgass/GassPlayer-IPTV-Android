name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: false

      - name: Build optimized release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Align and sign installable APK
        shell: bash
        run: |
          set -euo pipefail

          UNSIGNED_APK="$(find app/build/outputs/apk/release -type f -name '*-unsigned.apk' -print -quit)"
          test -n "$UNSIGNED_APK"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          ALIGNED_APK="$RUNNER_TEMP/GassPlayer-release-aligned.apk"
          FINAL_APK="app/build/outputs/apk/release/GassPlayer-Android-TV-release.apk"
          KEYSTORE="$RUNNER_TEMP/gassplayer-release.keystore"

          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"

          keytool -genkeypair \
            -keystore "$KEYSTORE" \
            -storepass android \
            -keypass android \
            -alias gassplayer \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname "CN=GassPlayer, OU=Android, O=GassPlayer, L=Napoli, ST=Campania, C=IT"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias gassplayer \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$FINAL_APK" \
            "$ALIGNED_APK"

          "$BUILD_TOOLS/zipalign" -c -v 4 "$FINAL_APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$FINAL_APK"

          rm -f "$UNSIGNED_APK" "$ALIGNED_APK" "$KEYSTORE"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: GassPlayer-Android-TV-release
          path: app/build/outputs/apk/release/GassPlayer-Android-TV-release.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
